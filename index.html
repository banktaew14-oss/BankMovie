<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineRecap - เล่าหนังเรื่องโปรด โดย Bank Basketman</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#E50914',
                            dark: '#141414',
                            card: '#181818',
                            hover: '#282828'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-brand-dark text-gray-100 min-h-screen flex flex-col justify-between selection:bg-brand-red selection:text-white">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-40 bg-brand-dark/95 backdrop-blur border-b border-zinc-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="#" class="flex items-center gap-2 text-2xl font-bold tracking-wider text-brand-red">
                <i class="fa-solid font-black fa-film"></i>
                <span>Cine<span class="text-white">Recap</span></span>
            </a>

            <!-- Search Bar -->
            <div class="relative w-48 sm:w-80">
                <input type="text" id="searchInput" placeholder="ค้นหาชื่อหนัง, ผู้กำกับ..." 
                    class="w-full bg-zinc-900 border border-zinc-700 rounded-full py-1.5 pl-9 pr-4 text-sm text-gray-200 placeholder-zinc-500 focus:outline-none focus:border-brand-red transition">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-zinc-500 text-sm"></i>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow">
        <!-- Hero Banner -->
        <div class="relative rounded-2xl overflow-hidden bg-gradient-to-r from-zinc-900 to-zinc-800 p-6 sm:p-10 mb-10 border border-zinc-800 shadow-2xl">
            <div class="relative z-10 max-w-2xl">
                <span class="bg-brand-red text-white text-xs font-semibold px-2.5 py-1 rounded-md mb-3 inline-block">หนังแนะนำประจำสัปดาห์</span>
                <h1 class="text-3xl sm:text-5xl font-extrabold text-white mb-4 leading-tight">Inception (จิตพิฆาตรูดขนานโลก)</h1>
                <p class="text-gray-300 text-sm sm:text-base mb-6 line-clamp-2 sm:line-clamp-none">
                    เรื่องราวของหัวขโมยฝีมือดีที่สุดในการฉกฉวยความลับอันล้ำค่าจากลึกสุดของจิตใต้สำนึก ในช่วงสภาวะความฝัน...
                </p>
                <div class="flex flex-wrap gap-4 items-center">
                    <button onclick="openModal(0)" class="bg-brand-red hover:bg-red-700 text-white font-medium px-5 py-2.5 rounded-lg flex items-center gap-2 transition shadow-lg shadow-red-900/30">
                        <i class="fa-solid fa-play"></i> อ่านเรื่องย่อฉบับเต็ม
                    </button>
                    <span class="text-sm text-zinc-400"><i class="fa-solid fa-pen-nib text-brand-red mr-1"></i> โดย Bank Basketman</span>
                </div>
            </div>
            <div class="absolute inset-0 bg-gradient-to-t from-brand-dark via-transparent to-transparent opacity-80 sm:hidden"></div>
        </div>

        <!-- Filter Categories -->
        <div class="flex items-center gap-2 overflow-x-auto pb-4 mb-6 scrollbar-none">
            <button onclick="filterCategory('all')" class="category-btn active px-4 py-1.5 rounded-full text-sm font-medium bg-brand-red text-white whitespace-nowrap transition">ทั้งหมด</button>
            <button onclick="filterCategory('sci-fi')" class="category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-zinc-800 hover:bg-zinc-700 text-gray-300 whitespace-nowrap transition">Sci-Fi</button>
            <button onclick="filterCategory('action')" class="category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-zinc-800 hover:bg-zinc-700 text-gray-300 whitespace-nowrap transition">แอ็คชั่น</button>
            <button onclick="filterCategory('drama')" class="category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-zinc-800 hover:bg-zinc-700 text-gray-300 whitespace-nowrap transition">ดราม่า</button>
            <button onclick="filterCategory('thriller')" class="category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-zinc-800 hover:bg-zinc-700 text-gray-300 whitespace-nowrap transition">ระทึกขวัญ</button>
        </div>

        <!-- Movie Grid -->
        <div id="movieGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Movie cards injected by JavaScript -->
        </div>
    </main>

    <!-- Modal for Detailed Recap -->
    <div id="recapModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-zinc-800 hover:bg-zinc-700 text-gray-300 w-9 h-9 rounded-full flex items-center justify-center transition z-10">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            
            <div id="modalContent" class="p-6">
                <!-- Dynamic Content -->
            </div>
        </div>
    </div>

    <!-- Footer with Credit -->
    <footer class="bg-zinc-950 border-t border-zinc-800 py-6 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-gray-400 text-sm mb-1">
                © 2026 CineRecap. All rights reserved.
            </p>
            <p class="text-zinc-500 text-xs flex items-center justify-center gap-1.5">
                <span>สรุปและรีวิวหนังโดย</span>
                <span class="text-brand-red font-medium">Bank Basketman</span>
                <i class="fa-solid fa-heart text-xs text-red-500"></i>
            </p>
        </div>
    </footer>

    <!-- JavaScript logic -->
    <script>
        const movies = [
            {
                id: 0,
                title: "Inception",
                category: "sci-fi",
                rating: "8.8",
                poster: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=600&q=80",
                recap: "คอบบ์ หัวขโมยมือหนึ่งในการเข้าไปในความฝันของผู้อื่น ได้รับข้อเสนอให้ซ้อนปลูกความคิด (Inception) เข้าไปในจิตใต้สำนึกของเป้าหมายเพื่อแลกกับการได้กลับบ้านหาลูกๆ เรื่องราวเต็มไปด้วยกลการซ้อนฝัน 4 ชั้นที่คุณต้องลุ้นจนหยุดหายใจ",
                reviewer: "Bank Basketman"
            },
            {
                id: 1,
                title: "Interstellar",
                category: "sci-fi",
                rating: "8.7",
                poster: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=600&q=80",
                recap: "เมื่อโลกกำลังจะล่มสลายจากสภาวะขาดแคลนอาหาร อดีตนักบินอวกาศต้องออกเดินทางข้ามรูหนอนในอวกาศเพื่อตามหาบ้านหลังใหม่ให้มนุษยชาติ หนังไซไฟปรัชญาชวนตั้งคำถามเกี่ยวกับมิติและพลังแห่งความรัก",
                reviewer: "Bank Basketman"
            },
            {
                id: 2,
                title: "The Dark Knight",
                category: "action",
                rating: "9.0",
                poster: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=600&q=80",
                recap: "แบทแมนต้องเผชิญหน้ากับ วายร้ายโรคจิตระดับตำนานอย่าง 'โจ๊กเกอร์' ที่ออกมาสร้างความโกลาหลในกอธแธม เพื่อพิสูจน์ว่าแม้แต่คนดีที่สุดก็สามารถตกต่ำกลายเป็นคนเลวได้",
                reviewer: "Bank Basketman"
            },
            {
                id: 3,
                title: "Parasite",
                category: "drama",
                rating: "8.5",
                poster: "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=80",
                recap: "ครอบครัวยากจนตระกูลคิม ค่อยๆ ปลอมตัวเข้าไปทำงานในบ้านมหาเศรษฐีตระกูลพัคทีละคน สะท้อนความเหลื่อมล้ำทางสังคมผ่านตลกสติแตกและความระทึกขวัญระดับช็อกโลก",
                reviewer: "Bank Basketman"
            }
        ];

        function renderMovies(movieList) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = movieList.map(movie => `
                <div class="bg-brand-card rounded-xl overflow-hidden border border-zinc-800 hover:border-zinc-700 transition duration-300 hover:-translate-y-1 group">
                    <div class="relative aspect-[2/3] overflow-hidden">
                        <img src="${movie.poster}" alt="${movie.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        <div class="absolute top-3 right-3 bg-black/70 backdrop-blur-md px-2 py-1 rounded text-xs text-yellow-400 font-bold flex items-center gap-1">
                            <i class="fa-solid fa-star"></i> ${movie.rating}
                        </div>
                    </div>
                    <div class="p-4">
                        <h3 class="font-bold text-lg text-white mb-1 group-hover:text-brand-red transition">${movie.title}</h3>
                        <p class="text-xs text-zinc-400 mb-3"><i class="fa-solid fa-user-pen mr-1"></i> ${movie.reviewer}</p>
                        <button onclick="openModal(${movie.id})" class="w-full bg-zinc-800 hover:bg-brand-red text-white text-sm font-medium py-2 rounded-lg transition">
                            อ่านสปอยล์ / เล่าเรื่อง
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat) {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-brand-red', 'text-white');
                btn.classList.add('bg-zinc-800', 'text-gray-300');
            });
            event.target.classList.remove('bg-zinc-800', 'text-gray-300');
            event.target.classList.add('bg-brand-red', 'text-white');

            if (cat === 'all') renderMovies(movies);
            else renderMovies(movies.filter(m => m.category === cat));
        }

        function openModal(id) {
            const movie = movies.find(m => m.id === id);
            const content = document.getElementById('modalContent');
            content.innerHTML = `
                <div class="aspect-video w-full rounded-xl overflow-hidden mb-4 bg-zinc-800">
                    <img src="${movie.poster}" class="w-full h-full object-cover">
                </div>
                <div class="flex items-center justify-between mb-2">
                    <h2 class="text-2xl font-bold text-white">${movie.title}</h2>
                    <span class="text-yellow-400 text-sm font-bold"><i class="fa-solid fa-star"></i> ${movie.rating}</span>
                </div>
                <p class="text-xs text-brand-red font-medium mb-4">รีวิวเจาะลึกโดย: ${movie.reviewer}</p>
                <div class="text-gray-300 text-sm leading-relaxed mb-6 bg-zinc-950 p-4 rounded-xl border border-zinc-850">
                    ${movie.recap}
                </div>
                <div class="border-t border-zinc-800 pt-4">
                    <h4 class="text-sm font-semibold text-white mb-2">แสดงความคิดเห็น</h4>
                    <textarea placeholder="พิมพ์ความรู้สึกหลังดูเรื่องนี้..." class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-brand-red mb-2 resize-none h-20"></textarea>
                    <button class="bg-brand-red hover:bg-red-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition">ส่งความคิดเห็น</button>
                </div>
            `;
            document.getElementById('recapModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('recapModal').classList.add('hidden');
        }

        // Search Filter
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = movies.filter(m => m.title.toLowerCase().includes(term));
            renderMovies(filtered);
        });

        // Initial Render
        renderMovies(movies);
    </script>
</body>
</html>
